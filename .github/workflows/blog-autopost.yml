name: Blog autopost

# 화·목 오전 8:41(KST)에 새 글 초안을 써서 검토용 PR로 올립니다.
# PR을 병합하면 Vercel이 ax-con.com/blog 에 게시합니다.
on:
  schedule:
    - cron: "41 23 * * 1,3" # UTC 월·수 23:41 = KST 화·목 08:41
  workflow_dispatch:
    inputs:
      topic:
        description: "이번에만 쓸 주제 (비우면 topics.json 대기열 순서대로)"
        required: false
      category:
        description: "주제를 직접 적었을 때의 분류"
        required: false
        default: strategy
        type: choice
        options: [strategy, industry, practice, guide]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: blog-autopost
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Write draft with Gemini
        id: gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          BLOG_TOPIC: ${{ github.event.inputs.topic }}
          BLOG_CATEGORY: ${{ github.event.inputs.category }}
        run: node scripts/blog/generate.mjs

      - name: Open review PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ steps.gen.outputs.slug }}
          TITLE: ${{ steps.gen.outputs.title }}
        run: |
          BRANCH="blog/$(date -u +%Y%m%d)-${SLUG}"
          git config user.name "ax-con-blog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add content/blog
          git commit -m "blog: ${TITLE}"
          git push -u origin "$BRANCH"
          gh label create blog-draft --color 1A3A5C --description "자동 작성 블로그 초안" 2>/dev/null || true
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "[블로그 초안] ${TITLE}" \
            --body-file .blog-pr-body.md \
            --label blog-draft
