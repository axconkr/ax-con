name: Blog autopost

# 정기 작성은 AX-Con Hermes가 맡습니다 (화·목, 텔레그램 승인).
# 이 워크플로는 Gemini로 초안을 급히 하나 더 만들 때 Actions 탭에서 수동 실행하는 예비 수단입니다.
# PR을 병합하면 Vercel이 ax-con.com/blog 에 게시합니다.
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "이번에만 쓸 주제 (비우면 topics.json 대기열 순서대로)"
        required: false
      category:
        description: "주제를 직접 적었을 때의 분류"
        required: false
        default: strategy
        type: choice
        options: [strategy, industry, practice, guide]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: blog-autopost
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find topics already in open draft PRs
        id: pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ids=""
          for b in $(gh pr list --label blog-draft --state open --json headRefName -q '.[].headRefName'); do
            git fetch -q --depth=1 origin "$b" || continue
            for f in $(git diff --name-only --diff-filter=A HEAD FETCH_HEAD -- content/blog/posts); do
              id=$(git show "FETCH_HEAD:$f" | sed -n 's/^topic: *//p' | head -1)
              [ -n "$id" ] && ids="$ids,$id"
            done
          done
          echo "ids=${ids#,}" >> "$GITHUB_OUTPUT"
          echo "열린 초안 PR의 주제: ${ids#,}"

      - name: Write draft with Gemini
        id: gen
        env:
          BLOG_PENDING_TOPICS: ${{ steps.pending.outputs.ids }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          BLOG_TOPIC: ${{ github.event.inputs.topic }}
          BLOG_CATEGORY: ${{ github.event.inputs.category }}
        run: node scripts/blog/generate.mjs

      - name: Open review PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ steps.gen.outputs.slug }}
          TITLE: ${{ steps.gen.outputs.title }}
        run: |
          BRANCH="blog/$(date -u +%Y%m%d)-${SLUG}"
          git config user.name "ax-con-blog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add content/blog
          git commit -m "blog: ${TITLE}"
          git push -u origin "$BRANCH"
          gh label create blog-draft --color 1A3A5C --description "자동 작성 블로그 초안" 2>/dev/null || true
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "[블로그 초안] ${TITLE}" \
            --body-file .blog-pr-body.md \
            --label blog-draft
